<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-label="Agente de IA en JavaScript — agenda de citas desde la terminal con IA local gratuita">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080718"/>
      <stop offset="52%" stop-color="#180b34"/>
      <stop offset="100%" stop-color="#0a1226"/>
    </linearGradient>
    <linearGradient id="titulo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4d9d"/>
      <stop offset="55%" stop-color="#ff8a5c"/>
      <stop offset="100%" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="borde" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4d9d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#5cf2c0" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="resplandor">
      <stop offset="0%" stop-color="#ff4d9d" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ff4d9d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="resplandor2">
      <stop offset="0%" stop-color="#5cf2c0" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#5cf2c0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="puntos" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <!-- Fondo y halos -->
  <rect width="1600" height="400" fill="url(#fondo)"/>
  <rect width="1600" height="400" fill="url(#puntos)"/>
  <circle cx="390" cy="200" r="300" fill="url(#resplandor)"/>
  <circle cx="1380" cy="90" r="260" fill="url(#resplandor2)"/>
  <path d="M0 396H1600" stroke="url(#titulo)" stroke-width="4"/>
  <path d="M735 40V360" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>

  <!-- Terminal -->
  <g transform="translate(86 68)">
    <rect x="0" y="0" width="600" height="264" rx="18" fill="#100d24" stroke="url(#borde)" stroke-width="2"/>
    <rect x="0" y="0" width="600" height="44" rx="18" fill="#1b1438"/>
    <rect x="0" y="28" width="600" height="16" fill="#1b1438"/>
    <circle cx="26" cy="22" r="7" fill="#ff4d9d"/>
    <circle cx="50" cy="22" r="7" fill="#ffd166"/>
    <circle cx="74" cy="22" r="7" fill="#5cf2c0"/>
    <text x="104" y="28" font-family="DejaVu Sans Mono, monospace" font-size="15" fill="#b9a9d6">agente-citas — terminal</text>

    <g font-family="DejaVu Sans Mono, monospace" font-size="17">
      <text x="28" y="82" fill="#5cf2c0">$ npm start</text>
      <text x="28" y="120" fill="#f3eaff">Tú: ¿Hay cita el 2 de dic a las 10:00?</text>
      <text x="28" y="158" fill="#ff9ec9">→ consultar_disponibilidad(15:00Z)</text>
      <text x="28" y="196" fill="#5cf2c0">✓ disponible · 10:00 Bogotá</text>
      <text x="28" y="234" fill="#f3eaff">Agente: ¿Tu nombre y correo?</text>
      <rect x="16" y="224" width="9" height="20" fill="#ffd166"/>
    </g>
  </g>

  <!-- Texto principal -->
  <g font-family="DejaVu Sans, sans-serif">
    <text x="770" y="152" font-size="76" font-weight="bold" fill="#ffffff" letter-spacing="1">AGENTE DE IA</text>
    <text x="770" y="238" font-size="76" font-weight="bold" fill="url(#titulo)" letter-spacing="1">EN JAVASCRIPT</text>
    <text x="774" y="288" font-size="18" fill="#d4c8ea" letter-spacing="1.2">IA LOCAL GRATUITA · SIN API KEY · 100% CÓDIGO ABIERTO</text>

    <g font-size="16" font-weight="bold" letter-spacing="0.5">
      <rect x="770" y="316" width="164" height="40" rx="20" fill="#ff4d9d" fill-opacity="0.13" stroke="#ff4d9d" stroke-opacity="0.55"/>
      <circle cx="792" cy="336" r="5" fill="#ff4d9d"/>
      <text x="808" y="342" fill="#ff9ec9">NODE.JS 22+</text>

      <rect x="946" y="316" width="148" height="40" rx="20" fill="#ffd166" fill-opacity="0.10" stroke="#ffd166" stroke-opacity="0.5"/>
      <circle cx="968" cy="336" r="5" fill="#ffd166"/>
      <text x="984" y="342" fill="#ffe6a8">QWEN 2.5</text>

      <rect x="1106" y="316" width="164" height="40" rx="20" fill="#5cf2c0" fill-opacity="0.10" stroke="#5cf2c0" stroke-opacity="0.5"/>
      <circle cx="1128" cy="336" r="5" fill="#5cf2c0"/>
      <text x="1144" y="342" fill="#9ff8d9">LLAMA.CPP</text>
    </g>
  </g>
</svg>
